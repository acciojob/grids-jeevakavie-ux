<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>GRIDs</title>

	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet"
	>

	<style>
		.container {
			width: 600px;
			max-width: 100%;
			border: 5px solid rgb(4, 255, 4);
			background-color: rgb(41, 0, 0);
			padding: 5px;
		}

		.row {
			height: 200px;
			border: 5px solid rgb(255, 188, 188);
		}

		.row > div {
			border: 2px dotted rgb(38, 38, 43);
		}

		.row:nth-child(1) > div:nth-child(1) {
			background-color: teal;
		}

		.row:nth-child(1) > div:nth-child(2) {
			background-color: thistle;
		}

		.row:nth-child(2) > div:nth-child(1) {
			background-color: tomato;
		}

		.row:nth-child(2) > div:nth-child(2) {
			background-color: turquoise;
		}

		.row:nth-child(3) > div:nth-child(1) {
			background-color: violet;
		}

		.row:nth-child(3) > div:nth-child(2) {
			background-color: yellowgreen;
		}
	</style>
	
</head>

<body>

	<div class="container">

		<div class="row">
			<div class="col-6 col-md-4">
				Row1 col1
			</div>

			<div class="col-6 col-md-8">
				Row1 col2
			</div>
		</div>

		<div class="row">
			<div class="col-md-4 offset-md-2">
				Row2 col1
			</div>

			<div class="col-md-4 offset-md-2">
				Row2 col2
			</div>
		</div>

		<div class="row justify-content-center">
			<div class="col-6 col-md-4 offset-md-0">
				Row3 col1
			</div>

			<div class="col-6 col-md-4">
				Row3 col2
			</div>
		</div>
	
</body>
</html>
