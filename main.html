<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    .container {
      width: 600px;
      border: 5px solid rgb(4, 255, 4);
      background-color: rgb(41, 0, 0);
    }

    .row {
      height: 200px;
      border: 5px solid rgb(255, 188, 188);
    }

    .col-md-4,
    .col-md-8 {
      border: 2px dotted rgb(38, 38, 43);
    }

    .row1-col1 {
      background-color: teal;
    }

    .row1-col2 {
      background-color: thistle;
    }

    .row2-col1 {
      background-color: tomato;
    }

    .row2-col2 {
      background-color: turquoise;
    }

    .row3-col1 {
      background-color: violet;
    }

    .row3-col2 {
      background-color: yellowgreen;
    }
  </style>
</head>

<body>

  <div class="container">

    
    <div class="row">
      <div class="col-6 col-md-4 row1-col1"></div>
      <div class="col-6 col-md-8 row1-col2"></div>
    </div>

    
    <div class="row">
      <div class="col-md-4 offset-md-2 col-6 row2-col1"></div>
      <div class="col-md-4 col-6 row2-col2"></div>
    </div>

    
    <div class="row justify-content-center">
      <div class="col-6 col-md-4 row3-col1"></div>
      <div class="col-6 col-md-4 row3-col2"></div>
    </div>

  </div>

</body>
</html>
